<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold">Catálogo de Produtos</h1>
            <p class="lead text-muted">Gerencie seus produtos de forma moderna e eficiente.</p>
        </header>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Produtos Adicionados</h2>
            <button id="show-form-btn" class="btn btn-primary btn-lg shadow-sm"><i class="fas fa-plus me-2"></i>Adicionar Novo Produto</button>
        </div>
        
        <div id="product-form-container" class="card shadow-sm mb-5" style="display: none;">
            <div class="card-body p-4">
                <h3 id="form-title" class="card-title mb-4">Adicionar Produto</h3>
                <form id="product-form">
                    <input type="hidden" id="editing-product-original-id">
                    <div class="mb-3">
                        <label for="product-id-manual" class="form-label">ID do Produto (Referência)</label>
                        <input type="text" class="form-control" id="product-id-manual" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label for="product-name" class="form-label">Nome do Produto</label><input type="text" class="form-control" id="product-name" required></div>
                        <div class="col-md-6 mb-3"><label for="product-category" class="form-label">Categoria</label><input type="text" class="form-control" id="product-category" required></div>
                    </div>
                    <div class="mb-3"><label for="product-description" class="form-label">Descrição (Mensagem para WhatsApp)</label><textarea class="form-control" id="product-description" rows="3"></textarea></div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label for="product-date" class="form-label">Data</label><input type="date" class="form-control" id="product-date" required></div>
                        <div class="col-md-6 mb-3"><label for="product-destination-url" class="form-label">URL de Destino (Webhook)</label><input type="url" class="form-control" id="product-destination-url" required></div>
                    </div>

                    <hr>
                    <h5 class="mb-3">Integração WhatsApp (Z-api)</h5>
                    <div class="mb-3">
                        <label for="whatsapp-group-id" class="form-label">ID do Grupo WhatsApp</label>
                        <input type="text" class="form-control" id="whatsapp-group-id" placeholder="Ex: 12036304xxxxxxxxxx@g.us">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="zapi-instance-id" class="form-label">ID da Instância Z-api</label>
                            <input type="text" class="form-control" id="zapi-instance-id">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="zapi-token" class="form-label">Token Z-api</label>
                            <input type="password" class="form-control" id="zapi-token">
                        </div>
                    </div>
                    
                    <hr>
                    <h5 class="mb-3">Integração Baserow</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label for="baserow-table-id" class="form-label">ID da Tabela (Baserow)</label><input type="text" class="form-control" id="baserow-table-id" placeholder="Ex: 573558"></div>
                        <div class="col-md-6 mb-3"><label for="baserow-api-token" class="form-label">Token da API (Baserow)</label><input type="password" class="form-control" id="baserow-api-token"></div>
                    </div>
                    <hr>
                    
                    <div class="mb-4">
                        <label class="form-label">Imagens do Produto</label>
                        <div id="drop-zone" class="drop-zone"><i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i><br>Arraste e solte os arquivos aqui ou clique para selecionar.<input type="file" id="file-input" multiple hidden></div>
                        <div id="image-previews" class="mt-3"></div>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="button" id="cancel-edit-btn" class="btn btn-light me-2">Cancelar</button>
                        <button type="submit" class="btn btn-success"><i class="fas fa-save me-2"></i>Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="mb-4">
            <label for="search-input" class="form-label fs-5">Buscar Produto</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-search"></i></span>
                <input type="search" id="search-input" class="form-control form-control-lg" placeholder="Digite o nome ou ID do produto...">
            </div>
        </div>
        <div id="product-list" class="list-group"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/gh/mcstudios/glightbox/dist/js/glightbox.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
