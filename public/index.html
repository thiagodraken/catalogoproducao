<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5 mb-5">
        <h1 class="mb-4">Catálogo de Produtos</h1>

        <button id="show-form-btn" class="btn btn-primary mb-4">Adicionar Novo Produto</button>

        <div id="product-form-container" class="card card-body mb-4" style="display: none;">
            <h3 id="form-title">Adicionar Produto</h3>
            <form id="product-form">
                <div class="mb-3">
                    <label for="product-name" class="form-label">Nome do Produto</label>
                    <input type="text" class="form-control" id="product-name" required>
                </div>
                <div class="mb-3">
                    <label for="product-category" class="form-label">Categoria</label>
                    <input type="text" class="form-control" id="product-category" required>
                </div>
                <div class="mb-3">
                    <label for="product-description" class="form-label">Descrição</label>
                    <textarea class="form-control" id="product-description" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label for="product-date" class="form-label">Data</label>
                    <input type="date" class="form-control" id="product-date" required>
                </div>
                <div class="mb-3">
                    <label for="product-destination-url" class="form-label">URL de Destino do Produto</label>
                    <input type="url" class="form-control" id="product-destination-url" placeholder="https://exemplo.com/produto-especifico" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Imagens do Produto</label>
                    <div id="drop-zone" class="drop-zone">
                        Arraste e solte os arquivos aqui ou clique para selecionar.
                        <input type="file" id="file-input" multiple hidden>
                    </div>
                    <div id="image-previews" class="mt-3"></div>
                </div>
                <button type="submit" class="btn btn-success">Salvar Produto</button>
                <button type="button" id="cancel-edit-btn" class="btn btn-light">Cancelar</button>
            </form>
        </div>

        <h2>Produtos Adicionados no Servidor</h2>
        <div id="product-list" class="list-group">
            </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
